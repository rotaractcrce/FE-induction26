<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — Rotaract CRCE</title>
    <link rel="icon" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/assets/fonts.css" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        display: grid;
        place-items: center;
        background: #dddbd6;
        color: #111;
        font-family: "Space Grotesk", sans-serif;
      }
      main { text-align: center; padding: 24px; animation: pop 0.35s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .code {
        font-size: clamp(80px, 18vw, 160px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .code em { font-style: normal; color: #ff1b00; }
      .wave { display: flex; justify-content: center; align-items: center; gap: 4px; height: 26px; margin: 14px 0 18px; }
      .wave span {
        width: 3px; border-radius: 2px; height: 8px; background: #ff1b00;
        animation: wave 1.1s ease-in-out infinite alternate;
      }
      .wave span:nth-child(1) { animation-delay: 0.10s; }
      .wave span:nth-child(2) { animation-delay: 0.05s; }
      .wave span:nth-child(3) { animation-delay: 0.30s; }
      .wave span:nth-child(4) { animation-delay: 0.00s; }
      .wave span:nth-child(5) { animation-delay: 0.25s; }
      .wave span:nth-child(6) { animation-delay: 0.15s; }
      .wave span:nth-child(7) { animation-delay: 0.20s; }
      p { opacity: 0.7; font-size: 15px; margin-bottom: 26px; }
      a {
        display: inline-block;
        color: #111; text-decoration: none;
        font-weight: 500;
        padding: 11px 22px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        border-radius: 999px;
        transition: background 0.2s ease, color 0.2s ease;
      }
      a:hover { background: #111; color: #dddbd6; }
      @keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes wave { from { height: 6px; } to { height: 22px; } }
      @media (prefers-reduced-motion: reduce) { .wave span { animation: none; } main { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="code">4<em>0</em>4</div>
      <div class="wave" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <p>Looks like you stepped outside the comfort zone — this page doesn't exist.</p>
      <a href="/">Back home</a>
    </main>
  </body>
</html>
